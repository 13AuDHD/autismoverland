<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>404 | Llama Scout</title>
  <meta name="robots" content="noindex">
  <script src="llamascout.com/js/privacy.js"></script>
  <link rel="stylesheet" href="llamascout.com/css/style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="llamascout.com/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="llamascout.com/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="llamascout.com/icons/favicon-16x16.png">
  <link rel="icon" href="llamascout.com/icons/favicon.ico" sizes="any">
  <link rel="manifest" href="llamascout.com/icons/site.webmanifest">
</head>

<body class="error-page">

  <main class="error-404">

    <img
      src="llamascout.com/images/logo.png"
      alt="Llama Scout"
      class="error-404-logo"
    >

    <p class="error-404-code">404</p>

    <h1>This Trail Goes Nowhere.</h1>

    <p class="error-404-message">
      Looks like this place isn't on the map.
      The page may have moved, disappeared, or never existed in the first place.
    </p>

    <p class="error-404-scout">
      No worries... let's get you back somewhere we've actually scouted.
    </p>

    <div class="error-404-actions">
      <a href="www.llamascout.com" class="primary-btn">
        Back to Llama Scout
      </a>

      <a href="llamascout.com/map.html" class="error-404-map-link">
        Explore the Map
      </a>
    </div>

  </main>

</body>
</html>
