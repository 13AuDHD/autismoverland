<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Places | Llama Scout</title>

  <link rel="stylesheet" href="css/style.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >
</head>

<body>

  <div id="site-header"></div>

  <main class="places-page">

    <section class="places-intro">
      <div class="container">

        <p class="eyebrow">Explore Places</p>

        <h1>Find somewhere that fits.</h1>

        <p>
          Browse campsites, pullouts, scenic stops, and other places
          with real-world sensory, access, connectivity, and vehicle
          information.
        </p>

      </div>
    </section>


    <section class="places-controls">

      <div class="container places-controls-inner">

        <label class="places-search">

          <i class="fa-solid fa-magnifying-glass"></i>

          <input
            id="places-search"
            type="search"
            placeholder="Search places..."
            autocomplete="off"
          >

        </label>


        <label class="places-filter">

          <span>Type</span>

          <select id="places-type-filter">
            <option value="all">All places</option>
          </select>

        </label>

      </div>

    </section>


    <section class="places-results">

      <div class="container">

        <div class="places-summary">
          <p id="places-count"></p>
        </div>

        <div
          id="places-grid"
          class="places-grid"
          aria-live="polite"
        ></div>

        <div
          id="places-empty"
          class="places-empty"
          hidden
        >
          <i class="fa-solid fa-map-location-dot"></i>
          <h2>No places found.</h2>
          <p>Try changing your search or filters.</p>
        </div>

      </div>

    </section>

  </main>

  <div id="site-footer"></div>

  <script src="js/main.js"></script>
  <script src="js/places.js"></script>

</body>
</html>
